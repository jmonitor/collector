name: Tests

on:
    push:
        branches: [ "*.x" ]
    pull_request:
        branches: [ "*.x" ]

permissions:
    contents: read

jobs:
    tests:
        name: PHPUnit (PHP ${{ matrix.php }}${{ matrix.deps == 'lowest' && ', lowest deps' || '' }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4' ]
                deps: [ 'highest' ]
                include:
                    # Validate the lowest allowed dependency bounds still resolve on the minimum PHP
                    - php: '7.4'
                      deps: 'lowest'
        steps:
            - uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: json, zlib, pdo
                  coverage: none

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php${{ matrix.php }}-${{ matrix.deps }}-${{ hashFiles('composer.json') }}
                  restore-keys: ${{ runner.os }}-php${{ matrix.php }}-${{ matrix.deps }}-

            - name: Install dependencies
              run: |
                  if [ "${{ matrix.deps }}" = "lowest" ]; then
                      composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress --no-interaction
                  else
                      composer update --prefer-dist --no-progress --no-interaction
                  fi

            - name: PHPUnit
              run: composer run-script phpunit

    quality:
        name: Lint & PHPStan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: json, zlib, pdo
                  coverage: none

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php8.3-quality-${{ hashFiles('composer.json') }}
                  restore-keys: ${{ runner.os }}-php8.3-quality-

            - name: Install dependencies
              run: composer update --prefer-dist --no-progress --no-interaction

            - name: Lint
              run: composer run-script lint:check

            - name: PHPStan
              run: composer run-script phpstan
